name: check

# Runs the tests, lints, then typechecks both the site source and the tests.
#
# Nothing is bundled or compiled. The tests and the linter run with no install
# at all; the typecheck needs @types/node, the project's only dependency, which
# is type declarations rather than code.
#
# Most of what a linter would tell us comes from the typechecker instead —
# jsconfig.json turns on noUnusedLocals, noUnusedParameters, noImplicitReturns
# and noFallthroughCasesInSwitch. oxlint covers the few things a typechecker
# cannot see, such as == versus ===, and Prettier covers layout, which is not a
# linter's job at all.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Active LTS, supported until April 2028. Node 26 becomes LTS in
          # October 2026 and is the natural next bump. The tests only use
          # node:test, node:assert and node:fs, so any Node 20+ will do;
          # 'lts/*' also works if you would rather this never need touching.
          node-version: "24"

      # Deliberately before the install, to keep it honest that the test suite
      # needs nothing but Node.
      - name: Tests
        run: node --test tests/*.test.js

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Install type declarations and playwright
        run: npm ci
      - name: Typecheck
        run: npx -y -p typescript@5 tsc -p jsconfig.json

      # Serves the repository and opens it in headless Chromium, to check the
      # map actually paints. Not a screenshot test: see tests/browser/.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:browser
